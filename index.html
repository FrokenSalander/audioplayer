<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Single-Use Audio Button</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 40px; }
    button { margin: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #codeInput { padding: 8px 10px; font-size: 15px; }
  </style>
</head>
<body>
  <h2>🎧 Single-Use Audio Player</h2>
  <p>Enter your code to unlock playback:</p>
  <input type="password" id="codeInput" placeholder="Enter code">
  <button id="checkCode">Unlock</button>
  <div style="margin-top:30px;">
    <button id="btn1" disabled>Play Audio</button>
  </div>
  <!-- Hidden audio element -->
  <audio id="player" hidden></audio>
  <script>
    // --- CONFIGURATION ---
    const audioFile = { url: "https://drive.google.com/uc?export=download&id=1Ke9O2NNyDF7DMEDqwKrEFBXe6SHPk373" };
	const validCodes = [
	  "B2191D6B12",
	  "00BF34CA0E",
	  "475042DEA0",
	  "975DB8CCA1",
	  "E505BC70AB",
	  "6D5E9A26D7",
	  "231BE34B92",
	  "E54C5B6D22",
	  "F4A3480EEF",
	  "2E12D30FA1",
	  "E1F09E34A9",
	  "1337C1C77C",
	  "7214E28CD6",
	  "16E3DB9919",
	  "F5842A2FF2",
	  "3ABEE2E737",
	  "78B3F978E4",
	  "80878098D6",
	  "DEFA50BD3E",
	  "DFC53C1A20",
	];
    let usedCodes = JSON.parse(localStorage.getItem("usedCodes") || "[]");
    const player = document.getElementById("player");
    const btn = document.getElementById("btn1");
 
    // --- UNLOCK BUTTON ---
    document.getElementById("checkCode").addEventListener("click", () => {
      const code = document.getElementById("codeInput").value.trim();
      if (usedCodes.includes(code)) {
        alert("❌ This code has already been used.");
        return;
      }
      if (validCodes.includes(code)) {
        alert("✅ Access granted! You can now play the audio.");
        btn.disabled = false;
        usedCodes.push(code);
        localStorage.setItem("usedCodes", JSON.stringify(usedCodes));
      } else {
        alert("Invalid code.");
      }
    });
 
    // --- PLAYBACK LOGIC ---
    btn.addEventListener("click", () => {
      // Disable immediately
      btn.disabled = true;
      btn.textContent = "Playing…";
      // Set audio source and play
      player.src = audioFile.url;
      player.play();
      // Update text when audio ends
      player.onended = () => {
        btn.textContent = "Played ✅";
      };
    });
  </script>
</body>
</html>
